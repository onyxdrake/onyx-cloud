<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Aktif — Onyx</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #eee; font-family: -apple-system, sans-serif; padding: 16px; max-width: 480px; margin: 0 auto; }
  a.back { color: #0f0; text-decoration: none; font-size: 13px; }
  h1 { font-size: 20px; margin: 12px 0 4px; background: linear-gradient(90deg, #0f0, #0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
  .session { background: #141414; border: 1px solid #1f1f1f; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .session.current { border-color: #0f0; background: #0a1f0a; }
  .session .loc { font-size: 14px; font-weight: 600; color: #0f0; margin-bottom: 4px; }
  .session .meta { font-size: 11px; color: #888; line-height: 1.6; }
  .session .badge { display: inline-block; background: #0f0; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-left: 6px; }
  .session button { background: #ff4444; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .empty { text-align: center; color: #666; padding: 40px 20px; font-size: 13px; }
</style>
</head>
<body>

<a class="back" href="/onyx.html">← Kembali</a>
<h1>🔐 Session Aktif</h1>
<p class="sub">Device yang lagi login ke akun lo. Kalau ada yang gak dikenal, keluarkan.</p>

<div id="list"></div>

<script>
const params = new URLSearchParams(window.location.search);
const email = localStorage.getItem('onyx_user_email') || params.get('email');

if (!email) {
  document.getElementById('list').innerHTML = '<div class="empty">Login dulu buat liat session.</div>';
} else {
  loadSessions();
}

async function loadSessions() {
  try {
    const r = await fetch('/api/auth/sessions?email=' + encodeURIComponent(email));
    const d = await r.json();
    if (!d.ok || !d.sessions) return renderEmpty();

    const currentSession = localStorage.getItem('onyx_session_id');
    const list = document.getElementById('list');

    if (d.sessions.length === 0) return renderEmpty();

    list.innerHTML = d.sessions.map(s => {
      const isCurrent = s.sessionId === currentSession;
      const tgl = new Date(s.time).toLocaleString('id-ID');
      return `
        <div class="session ${isCurrent ? 'current' : ''}">
          <div class="loc">${s.city}, ${s.country}${isCurrent ? '<span class="badge">INI LO</span>' : ''}</div>
          <div class="meta">
            🕐 ${tgl}<br>
            💻 ${s.device}<br>
            🌐 ${s.isp}<br>
            🔢 ${s.ip.slice(0, -3)}***
          </div>
          ${!isCurrent ? `<button onclick="revoke('${s.sessionId}')">🚪 Keluarkan</button>` : ''}
        </div>
      `;
    }).join('');
  } catch (e) {
    renderEmpty();
  }
}

function renderEmpty() {
  document.getElementById('list').innerHTML = '<div class="empty">Gak ada session aktif.</div>';
}

async function revoke(sessionId) {
  if (!confirm('Keluarkan session ini? Device itu harus login ulang.')) return;
  try {
    const r = await fetch(`/api/auth/revoke?email=${encodeURIComponent(email)}&session=${sessionId}`);
    if (r.ok) {
      alert('✅ Session dikeluarkan.');
      loadSessions();
    } else {
      alert('❌ Gagal. Coba lagi.');
    }
  } catch (e) {
    alert('❌ Error: ' + e.message);
  }
}
</script>

</body>
</html>
