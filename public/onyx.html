<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onyx AI</title>
<!-- Markdown Parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Font Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #ececec;
    --text-muted: #888;
    --accent: #10a37f; /* Warna khas ChatGPT */
    --user-bg: #2a2a2a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
    font-size: 15px;
  }

  /* --- Sidebar --- */
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
  }
  .sidebar-header { padding: 16px; }
  .btn-new {
    width: 100%; padding: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s;
  }
  .btn-new:hover { background: var(--user-bg); }
  .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-item {
    padding: 12px; border-radius: 8px; font-size: 13px; color: #aaa;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .chat-item:hover { background: var(--user-bg); color: #fff; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 12px; }
  .sidebar-footer a { color: var(--text-muted); text-decoration: none; }

  /* --- Main Chat --- */
  .main { flex: 1; display: flex; flex-direction: column; position: relative; }
  
  /* Top Bar */
  .top-bar {
    padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); background: rgba(10,10,10,0.8);
    backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10;
  }
  .top-bar h2 { font-size: 14px; font-weight: 500; color: var(--text-muted); }
  
  /* Private Toggle */
  .private-toggle {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border); padding: 6px 12px;
    border-radius: 20px; cursor: pointer; transition: all 0.2s;
  }
  .private-toggle.active { color: var(--accent); border-color: var(--accent); background: rgba(16,163,127,0.1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .private-toggle.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* Chat Container */
  .chat-container {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    padding: 24px; scroll-behavior: smooth;
  }
  .message {
    max-width: 768px; width: 100%; margin: 0 auto; padding: 24px 0;
    display: flex; gap: 20px;
  }
  .message.user { justify-content: flex-end; }
  
  .avatar {
    width: 32px; height: 32px; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; font-size: 13px;
    font-weight: 600; flex-shrink: 0;
  }
  .avatar.user-avatar { background: #555; color: #fff; }
  .avatar.ai-avatar { background: var(--accent); color: #fff; }
  
  .content {
    font-size: 15px; line-height: 1.7; flex: 1; overflow-x: auto;
    word-wrap: break-word; color: #d1d1d1;
  }
  
  /* Markdown Styling */
  .content p { margin-bottom: 16px; }
  .content p:last-child { margin-bottom: 0; }
  .content strong { color: #fff; font-weight: 600; }
  .content ul, .content ol { margin-left: 24px; margin-bottom: 16px; }
  .content li { margin-bottom: 6px; }
  .content code {
    background: #1e1e1e; padding: 2px 6px; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 13px; color: #ff9d00;
  }
  .content pre {
    background: #000; padding: 16px; border-radius: 8px; overflow-x: auto;
    margin: 16px 0; border: 1px solid #333;
  }
  .content pre code { background: none; padding: 0; color: #ececec; }

  /* Input Area */
  .input-wrapper {
    padding: 24px; background: linear-gradient(180deg, transparent, var(--bg) 30%);
  }
  .input-box {
    max-width: 768px; margin: 0 auto; position: relative;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; display: flex;
    align-items: flex-end; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .input-box:focus-within { border-color: #555; }
  textarea {
    flex: 1; background: transparent; border: none; color: #fff;
    outline: none; resize: none; font-size: 15px; font-family: inherit;
    min-height: 24px; max-height: 200px; padding: 4px 0; line-height: 1.5;
  }
  button.send {
    background: var(--accent); color: #fff; border: none;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  button.send:hover { background: #0e8f6e; }
  button.send:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* Animasi Loading */
  .typing-dots { display: flex; gap: 4px; align-items: center; height: 24px; }
  .typing-dots span {
    width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <button class="btn-new" onclick="resetChat()">+ New Chat</button>
  </div>
  <div class="chat-list" id="chat-list">
    <!-- List history bakal masuk sini -->
  </div>
  <div class="sidebar-footer">
    <a href="/index.html">← Back to Home</a>
  </div>
</div>

<!-- Main Chat -->
<div class="main">
  <div class="top-bar">
    <h2>Onyx AI</h2>
    <div class="private-toggle" id="privToggle" onclick="togglePrivate()">
      <div class="dot"></div> Private Mode
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message ai">
      <div class="avatar ai-avatar">O</div>
      <div class="content">
        Halo! Gue <b>Onyx</b>. Pilih <b>5 Tingkatan</b> (Operator, Reasoner, Coder, Researcher, Creator) atau langsung ketik pertanyaan lo. <br><br>
        Aktifin <b>Private Mode</b> di pojok kanan atas kalau lo mau chat privat (gue gak bakal bisa baca).
      </div>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="input-box">
      <textarea id="input" placeholder="Tanya apapun..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send" id="sendBtn" onclick="kirim()">↑</button>
    </div>
  </div>
</div>

<script>
let isPrivate = false;
let chatHistory = []; // Nyimpen history buat context
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function togglePrivate() {
  isPrivate = !isPrivate;
  document.getElementById('privToggle').classList.toggle('active', isPrivate);
}

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function resetChat() {
  chat.innerHTML = `
    <div class="message ai">
      <div class="avatar ai-avatar">O</div>
      <div class="content">Chat baru. Ada yang bisa gue bantu?</div>
    </div>`;
  chatHistory = [];
}

async function kirim() {
  const pesan = input.value.trim();
  if (!pesan) return;

  // 1. Tambah pesan user ke UI
  chat.innerHTML += `
    <div class="message user">
      <div class="content">${pesan}</div>
      <div class="avatar user-avatar">U</div>
    </div>`;
  
  // Simpen ke history
  chatHistory.push({ role: 'user', content: pesan });
  
  input.value = '';
  input.style.height = '';
  scrollToBottom();

  // 2. Cek Private Mode
  if (isPrivate) {
    setTimeout(() => {
      chat.innerHTML += `
        <div class="message ai">
          <div class="avatar ai-avatar">O</div>
          <div class="content" style="color:#888;"><i>🔒 Pesan ini disimpan di HP lo. Server gak bisa baca.</i></div>
        </div>`;
      scrollToBottom();
    }, 500);
    return;
  }

  // 3. Loading Indicator
  const loadingId = 'load_' + Date.now();
  chat.innerHTML += `
    <div class="message ai" id="${loadingId}">
      <div class="avatar ai-avatar">O</div>
      <div class="content">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  scrollToBottom();

  // 4. Request ke Server
  try {
    // Batasi history max 10 pesan terakhir biar gak berat
    const historyLimit = chatHistory.slice(-10);

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        pesan, 
        userId: 'user_' + Date.now(),
        history: historyLimit // Kirim history ke backend
      })
    });
    const data = await res.json();
    
    // Render Markdown
    const htmlContent = marked.parse(data.balasan || 'Error');
    
    document.getElementById(loadingId).remove();
    chat.innerHTML += `
      <div class="message ai">
        <div class="avatar ai-avatar">O</div>
        <div class="content">${htmlContent}</div>
      </div>`;
    
    // Simpen balasan ke history
    chatHistory.push({ role: 'assistant', content: data.balasan });
    
    scrollToBottom();
  } catch (err) {
    document.getElementById(loadingId).remove();
    chat.innerHTML += `
      <div class="message ai">
        <div class="avatar ai-avatar">O</div>
        <div class="content" style="color:#f44;">⚠️ Server offline atau error.</div>
      </div>`;
    scrollToBottom();
  }
}

// Enter key buat kirim
input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirim();
  }
});
</script>
</body>
</html>
