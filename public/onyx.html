<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onyx Cloud - Chat</title>
<!-- Load Markdown Parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --sidebar: #111111;
    --border: #222222;
    --text: #ececec;
    --accent: #00ff88;
    --hover: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; }
  .sidebar-header { padding: 16px; }
  .btn-new { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-new:hover { background: var(--hover); }
  .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { padding: 10px; border-radius: 6px; font-size: 13px; color: #aaa; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .chat-item:hover { background: var(--hover); color: var(--text); }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 12px; color: #666; }

  /* Main Chat */
  .main { flex: 1; display: flex; flex-direction: column; position: relative; }
  
  /* Header */
  .top-bar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg); }
  .top-bar h2 { font-size: 14px; color: #888; font-weight: 500; }
  .private-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #888; background: var(--sidebar); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
  .private-toggle.active { color: var(--accent); border-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .private-toggle.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* Chat Container */
  .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px; }
  .message { max-width: 800px; width: 100%; margin: 0 auto; padding: 20px 0; display: flex; gap: 16px; border-bottom: 1px solid #1a1a1a; }
  .message.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
  .avatar.user-avatar { background: #333; color: #fff; }
  .avatar.ai-avatar { background: var(--accent); color: #000; }
  .content { font-size: 15px; line-height: 1.6; flex: 1; overflow-x: auto; }
  
  /* Markdown Styling */
  .content p { margin-bottom: 10px; }
  .content strong { color: var(--accent); }
  .content ul, .content ol { margin-left: 20px; margin-bottom: 10px; }
  .content code { background: #222; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
  .content pre { background: #1a1a1a; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
  .content pre code { background: none; padding: 0; color: #ececec; }

  /* Input Area */
  .input-wrapper { padding: 20px; background: var(--bg); }
  .input-box { max-width: 800px; margin: 0 auto; position: relative; background: var(--sidebar); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; display: flex; align-items: flex-end; gap: 10px; }
  textarea { flex: 1; background: transparent; border: none; color: var(--text); outline: none; resize: none; font-size: 15px; font-family: inherit; min-height: 24px; max-height: 200px; padding: 4px 0; }
  button.send { background: var(--accent); color: #000; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  button.send:hover { background: #00cc6a; }
  button.send:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* Animasi loading */
  .typing { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing:nth-child(1) { animation-delay: -0.32s; }
  .typing:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <button class="btn-new" onclick="document.getElementById('chat').innerHTML=''">+ New Chat</button>
  </div>
  <div class="chat-list">
    <div class="chat-item">Cara bikin API</div>
    <div class="chat-item">Error Python</div>
    <div class="chat-item">Riset saham</div>
  </div>
  <div class="sidebar-footer">
    <a href="/index.html" style="color:#666; text-decoration:none;">← Back to Home</a>
  </div>
</div>

<!-- Main Chat -->
<div class="main">
  <div class="top-bar">
    <h2>Onyx AI Chat</h2>
    <div class="private-toggle" id="privToggle" onclick="togglePrivate()">
      <div class="dot"></div> Private Mode
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message ai">
      <div class="avatar ai-avatar">O</div>
      <div class="content">
        Halo! Gue <b>Onyx</b>. Pilih <b>5 Tingkatan</b> (Operator, Reasoner, Coder, Researcher, Creator) atau langsung ketik pertanyaan lo. <br><br>
        Aktifin <b>Private Mode</b> di pojok kanan atas kalau lo mau chat privat (gue gak bakal bisa baca).
      </div>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="input-box">
      <textarea id="input" placeholder="Tanya apapun..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send" id="sendBtn" onclick="kirim()">↑</button>
    </div>
  </div>
</div>

<script>
let isPrivate = false;
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function togglePrivate() {
  isPrivate = !isPrivate;
  document.getElementById('privToggle').classList.toggle('active', isPrivate);
}

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

async function kirim() {
  const pesan = input.value.trim();
  if (!pesan) return;

  // Tampilkan Pesan User
  chat.innerHTML += `
    <div class="message user">
      <div class="content">${pesan}</div>
      <div class="avatar user-avatar">U</div>
    </div>`;
  input.value = '';
  input.style.height = '';
  scrollToBottom();

  // Private Mode
  if (isPrivate) {
    setTimeout(() => {
      chat.innerHTML += `
        <div class="message ai">
          <div class="avatar ai-avatar">O</div>
          <div class="content" style="color:#888;">🔒 <i>Pesan disimpan di HP lo. Server gak bisa baca ini.</i></div>
        </div>`;
      scrollToBottom();
    }, 500);
    return;
  }

  // Loading AI
  const loadingId = 'load_' + Date.now();
  chat.innerHTML += `
    <div class="message ai" id="${loadingId}">
      <div class="avatar ai-avatar">O</div>
      <div class="content">
        <span class="typing"></span> <span class="typing"></span> <span class="typing"></span>
      </div>
    </div>`;
  scrollToBottom();

  // Request ke Server
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pesan, userId: 'user_' + Date.now() })
    });
    const data = await res.json();
    
    // Render Markdown
    const htmlContent = marked.parse(data.balasan || 'Error');
    
    document.getElementById(loadingId).remove();
    chat.innerHTML += `
      <div class="message ai">
        <div class="avatar ai-avatar">O</div>
        <div class="content">${htmlContent}</div>
      </div>`;
    scrollToBottom();
  } catch (err) {
    document.getElementById(loadingId).remove();
    chat.innerHTML += `
      <div class="message ai">
        <div class="avatar ai-avatar">O</div>
        <div class="content" style="color:#f44;">⚠️ Server offline atau error.</div>
      </div>`;
    scrollToBottom();
  }
}

input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirim();
  }
});
</script>
</body>
</html>
