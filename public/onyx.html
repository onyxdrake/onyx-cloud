<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onyx AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --border: #e5e5e5;
    --text: #111111;
    --text-muted: #888888;
    --accent: #000000;
    --hover: #efefef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; overflow: hidden;
    font-size: 15px;
  }

  /* Sidebar */
  .sidebar {
    width: 260px; background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; transition: 0.3s;
  }
  .sidebar-header { padding: 16px; }
  .btn-new {
    width: 100%; padding: 12px; background: #fff;
    border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; cursor: pointer; font-weight: 500;
    transition: background 0.2s; text-align: left;
  }
  .btn-new:hover { background: var(--hover); }
  .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-item { padding: 10px; border-radius: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
  .chat-item:hover { background: var(--hover); color: var(--text); }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 12px; }
  .sidebar-footer a { color: var(--text-muted); text-decoration: none; }

  /* Main Chat */
  .main { flex: 1; display: flex; flex-direction: column; position: relative; }
  .top-bar {
    padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .top-bar h2 { font-size: 16px; font-weight: 600; }
  .status-badge { font-size: 12px; color: #10a37f; background: #e6f7f2; padding: 4px 12px; border-radius: 20px; font-weight: 500; }

  /* Chat Area */
  .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
  .message { max-width: 800px; width: 100%; margin: 0 auto; display: flex; gap: 16px; }
  .message.user { flex-direction: row-reverse; }
  
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
  .avatar.ai-avatar { background: #111; color: #fff; }
  .avatar.user-avatar { background: #ddd; color: #333; }
  
  .content { font-size: 15px; line-height: 1.6; flex: 1; color: var(--text); padding-top: 6px; }
  .message.user .content { background: #f4f4f4; padding: 12px 16px; border-radius: 16px; }
  
  /* Markdown */
  .content p { margin-bottom: 12px; }
  .content strong { font-weight: 600; }
  .content code { background: #f0f0f0; color: #d63384; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
  .content pre { background: #111; color: #fff; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }

  /* Input Area */
  .input-wrapper { padding: 24px; }
  .input-box {
    max-width: 800px; margin: 0 auto; display: flex; gap: 12px;
    background: #fff; border: 1px solid var(--border); padding: 12px 16px;
    border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .input-box:focus-within { border-color: #999; }
  textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-family: inherit; font-size: 15px; min-height: 24px; max-height: 200px; padding-top: 4px; }
  button.send { background: #111; color: #fff; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  button.send:hover { background: #333; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <button class="btn-new" onclick="resetChat()">+ New Chat</button>
  </div>
  <div class="chat-list">
    <div class="chat-item">Cara bikin API</div>
    <div class="chat-item">Error Python</div>
  </div>
  <div class="sidebar-footer">
    <a href="/index.html">← Back to Home</a>
  </div>
</div>

<!-- Main Chat -->
<div class="main">
  <div class="top-bar">
    <h2>Onyx AI</h2>
    <div class="status-badge">Online</div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message ai">
      <div class="avatar ai-avatar">O</div>
      <div class="content">
        Halo! Gue Onyx. Ada yang bisa gue bantu hari ini?
      </div>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="input-box">
      <textarea id="input" placeholder="Tanya apapun..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send" onclick="kirim()">↑</button>
    </div>
  </div>
</div>

<script>
let chatHistory = [];
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }
function resetChat() {
  chat.innerHTML = `<div class="message ai"><div class="avatar ai-avatar">O</div><div class="content">Chat baru. Ada yang bisa gue bantu?</div></div>`;
  chatHistory = [];
}

async function kirim() {
  const pesan = input.value.trim();
  if (!pesan) return;

  chat.innerHTML += `<div class="message user"><div class="content">${pesan}</div><div class="avatar user-avatar">U</div></div>`;
  chatHistory.push({ role: 'user', content: pesan });
  input.value = ''; input.style.height = ''; scrollToBottom();

  const loadingId = 'load_' + Date.now();
  chat.innerHTML += `<div class="message ai" id="${loadingId}"><div class="avatar ai-avatar">O</div><div class="content" style="color:#888;">Thinking...</div></div>`;
  scrollToBottom();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pesan, userId: 'user_' + Date.now(), history: chatHistory.slice(-10) })
    });
    const data = await res.json();
    const html = marked.parse(data.balasan || 'Error');
    
    document.getElementById(loadingId).remove();
    chat.innerHTML += `<div class="message ai"><div class="avatar ai-avatar">O</div><div class="content">${html}</div></div>`;
    chatHistory.push({ role: 'assistant', content: data.balasan });
    scrollToBottom();
  } catch (err) {
    document.getElementById(loadingId).remove();
    chat.innerHTML += `<div class="message ai"><div class="avatar ai-avatar">O</div><div class="content" style="color:#f44;">⚠️ Server error.</div></div>`;
  }
}

input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); kirim(); }
});
</script>
</body>
</html>
