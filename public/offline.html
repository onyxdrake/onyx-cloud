<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Onyx — Sedang Perbaikan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .box { max-width: 400px; }
    .icon { font-size: 80px; margin-bottom: 20px; animation: spin 3s linear infinite; display: inline-block; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    h1 { font-size: 24px; color: #0f0; margin-bottom: 10px; }
    p { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .btn { display: inline-block; background: #0f0; color: #000; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; }
    .btn:active { background: #0c0; }
    .status { margin-top: 20px; font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔧</div>
    <h1>Sedang Perbaikan</h1>
    <p>Server Onyx lagi offline. Kemungkinan lagi di-update, atau koneksi lo bermasalah.</p>
    <p>Coba lagi beberapa menit lagi ya.</p>
    <a class="btn" href="/onyx.html">🔄 Coba Lagi</a>
    <div class="status" id="status">Mengecek koneksi...</div>
  </div>

  <script>
    const status = document.getElementById('status');
    let detik = 0;
    async function cek() {
      detik++;
      status.textContent = `Mengecek... (${detik})`;
      try {
        const res = await fetch('/api/ping', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          status.textContent = '🟢 Server online! Redirect...';
          setTimeout(() => window.location.href = '/onyx.html', 1000);
          return;
        }
      } catch (e) {}
      status.textContent = `🔴 Server offline. Coba lagi (${detik})`;
    }
    cek();
    setInterval(cek, 10000);
  </script>
</body>
</html>
