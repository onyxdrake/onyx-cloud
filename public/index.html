<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onyx Cloud</title>
<style>
  body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
  h1 { color: #0f0; }
  #start-btn { display: none; background: #0f0; color: #000; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Onyx Cloud</h1>
  <p id="loading-txt">Memverifikasi Keaslian Server...</p>
  
  <a href="/onyx.html" id="start-btn">Masuk ke Chat</a>

  <script>
    async function cekServer() {
      try {
        const res = await fetch('/api/server-signature');
        const data = await res.json();
        
        if (!data.ok) throw new Error('Invalid Signature');
        
        document.getElementById('start-btn').style.display = 'inline-block';
        document.getElementById('loading-txt').style.display = 'none';
      } catch (err) {
        document.body.innerHTML = `
          <div style="text-align:center; padding:50px; color:#fff;">
            <h1 style="color:#f44;">⚠️ Server Tidak Valid / Offline</h1>
            <p style="color:#888;">Sistem Onyx sedang maintenance atau ini adalah aplikasi bajakan.</p>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; background:#0f0; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Coba Lagi</button>
          </div>
        `;
      }
    }
    cekServer();
  </script>
</body>
</html>
