<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Onyx Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Background Anime Rem + Blur */
  body {
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url('https://c4.wallpaperflare.com/wallpaper/471/555/394/re-zero-rem-re-zero-kara-hajimeru-isekai-seikatsu-anime-girls-hd-wallpaper-preview.jpg') no-repeat center center/cover;
    position: relative;
  }
  
  /* Overlay putih transparan biar teks kebaca */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    z-index: 1;
  }

  .login-card {
    position: relative; z-index: 2;
    background: rgba(255, 255, 255, 0.9);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    width: 100%; max-width: 400px;
    text-align: center;
  }

  .logo { width: 60px; height: 60px; background: #000; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: bold; margin-bottom: 16px; }
  h1 { font-size: 24px; color: #111; margin-bottom: 8px; }
  p { font-size: 13px; color: #666; margin-bottom: 24px; }

  .input-group { position: relative; margin-bottom: 16px; text-align: left; }
  label { font-size: 12px; color: #444; margin-bottom: 6px; display: block; font-weight: 600; }
  input {
    width: 100%; padding: 14px 16px;
    border: 1px solid #ddd; border-radius: 12px;
    font-size: 14px; font-family: inherit; outline: none;
    transition: border 0.2s, box-shadow 0.2s;
    background: #fff;
  }
  input:focus { border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.1); }

  /* Tombol Mata (Liat Password) */
  .toggle-pass {
    position: absolute; right: 16px; top: 36px;
    cursor: pointer; font-size: 16px; opacity: 0.5;
  }
  .toggle-pass:hover { opacity: 1; }

  .btn-login {
    width: 100%; padding: 14px;
    background: #111; color: #fff;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    margin-top: 10px; transition: transform 0.1s;
  }
  .btn-login:active { transform: scale(0.98); }

  .footer-text { margin-top: 20px; font-size: 12px; color: #888; }
  .footer-text a { color: #000; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">O</div>
  <h1>Welcome Back</h1>
  <p>Login ke Onyx Cloud</p>

  <div class="input-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="nama@email.com">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <!-- Tombol Mata -->
    <span class="toggle-pass" onclick="togglePassword()">👁️</span>
  </div>

  <button class="btn-login" onclick="login()">Masuk</button>

  <p class="footer-text">Belum punya akun? <a href="/register.html">Daftar</a></p>
</div>

<script>
function togglePassword() {
  const pass = document.getElementById('password');
  const icon = document.querySelector('.toggle-pass');
  if (pass.type === 'password') {
    pass.type = 'text';
    icon.innerText = '🙈';
  } else {
    pass.type = 'password';
    icon.innerText = '👁️';
  }
}

function login() {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  
  if (!email || !pass) {
    alert("Isi email dan password dulu!");
    return;
  }
  
  // Simulasi login sukses, redirect ke chat
  window.location.href = '/onyx.html';
}
</script>
</body>
</html>
