<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Login — Onyx</title>
<style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; } .box { background: #141414; border: 1px solid #1f1f1f; border-radius: 16px; padding: 24px; max-width: 380px; width: 100%; } h1 { font-size: 22px; margin-bottom: 6px; background: linear-gradient(90deg, #0f0, #0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } p { color: #666; font-size: 13px; margin-bottom: 20px; } input { width: 100%; background: #0a0a0a; border: 1px solid #222; color: #eee; padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; outline: none; } input:focus { border-color: #0f0; } button { width: 100%; background: #0f0; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px; } button:disabled { opacity: 0.5; } .link { text-align: center; margin-top: 16px; font-size: 13px; } .link a { color: #0f0; text-decoration: none; } .msg { padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; } .msg.ok { background: #1a3a1a; color: #0f0; display: block; } .msg.err { background: #3a1a1a; color: #f44; display: block; } .hint { font-size: 11px; color: #f44; margin-top: -8px; margin-bottom: 12px; }</style></head>
<body><div class="box">
<h1>Login Onyx</h1>
<p>Sign in to your account.</p>
<div class="msg" id="msg"></div>
<input id="email" type="email" placeholder="Email" autocomplete="email">
<div class="hint" id="hint-email"></div>
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<div class="hint" id="hint-password"></div>
<button onclick="login()" id="btn">Login</button>
<div class="link">Don't have an account? <a href="/register.html">Register</a></div>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const he = document.getElementById('hint-email');
  const hp = document.getElementById('hint-password');
  const btn = document.getElementById('btn');
  msg.className = 'msg'; msg.textContent = '';
  he.textContent = ''; hp.textContent = '';
  if (!email) { he.textContent = '⚠️ Email required'; return; }
  if (!email.includes('@')) { he.textContent = '⚠️ Invalid email'; return; }
  if (!password) { hp.textContent = '⚠️ Password required'; return; }
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('onyx_userId', data.userId);
      localStorage.setItem('onyx_email', email);
      localStorage.setItem('onyx_tier', data.tier);
      msg.className = 'msg ok'; msg.textContent = '✅ Login successful! Tier: ' + data.tier;
      setTimeout(() => window.location.href = '/onyx.html', 1000);
    } else {
      msg.className = 'msg err'; msg.textContent = '❌ ' + (data.error || 'Login failed');
    }
  } catch (e) { msg.className = 'msg err'; msg.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}
</script></body></html>
