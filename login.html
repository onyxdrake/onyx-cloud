<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Onyx Cloud</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #eee; font-family: -apple-system, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  h1 { color: #0f0; font-size: 24px; margin-bottom: 8px; text-align: center; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; text-align: center; }
  label { display: block; color: #aaa; font-size: 12px; margin: 12px 0 4px; }
  input { width: 100%; background: #111; border: 1px solid #222; color: #eee; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
  input:focus { border-color: #0f0; }
  button { width: 100%; background: #0f0; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 16px; }
  .msg { padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; display: none; }
  .msg.ok { background: #1a3a1a; color: #0f0; display: block; }
  .msg.err { background: #3a1010; color: #f44; display: block; }
  a { color: #0f0; text-decoration: none; }
  .back { font-size: 12px; color: #888; text-align: center; margin-top: 16px; }
</style>
</head>
<body>

<h1>🔐 Login Onyx</h1>
<p class="sub">Masukin email + password. Kami kirim magic link ke email lo.</p>

<label>Email</label>
<input type="email" id="email" placeholder="email@example.com" autocomplete="email">

<label>Password</label>
<input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

<button onclick="login()">📧 Kirim Magic Link</button>

<div class="msg" id="msg"></div>

<p class="back"><a href="/register.html">Belum punya akun? Daftar</a></p>

<script>
const params = new URLSearchParams(window.location.search);
const telegramId = params.get('telegram');

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!email || !password) {
    msg.className = 'msg err';
    msg.textContent = 'Isi email + password';
    return;
  }

  msg.className = 'msg';
  msg.textContent = 'Kirim...';
  msg.style.display = 'block';

  try {
    const r = await fetch('/api/auth/magic-link/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, telegramId })
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = 'msg ok';
      msg.textContent = '✅ Magic link dikirim ke email lo. Cek inbox!';
    } else {
      msg.className = 'msg err';
      msg.textContent = '❌ ' + (d.error || 'Gagal login');
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = '❌ ' + e.message;
  }
}

// Enter key
document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});
</script>

</body>
</html>
