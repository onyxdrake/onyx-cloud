name: Build Android APK

on:
  push:
    branches: [ main ] 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Init Capacitor & Build
        run: |
          # Bikin folder android dari nol tanpa package.json
          npx cap init "Onyx Cloud" "com.onyx.cloud" --web-dir=public
          npx cap add android
          
          # Copy folder public ke Android
          npx cap sync android
          
          # Build APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onyx-cloud-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
