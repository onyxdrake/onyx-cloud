<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title>
<style>body{background:#0a0a0a;color:#0f0;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0}canvas{border:2px solid #0f0;background:#000}#score{font-size:20px;margin-bottom:10px}a{color:#0f0;margin-top:20px}</style></head>
<body>
<div id="score">Score: 0</div>
<canvas id="c" width="300" height="300"></canvas>
<a href="/game.html">← Balik</a>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),s=15;
let snake=[{x:10,y:10}],dir={x:0,y:0},food={x:15,y:15},score=0;
function rand(){return Math.floor(Math.random()*20)}
function draw(){x.fillStyle='#000';x.fillRect(0,0,300,300);x.fillStyle='#0f0';snake.forEach(p=>x.fillRect(p.x*s,p.y*s,s-1,s-1));x.fillStyle='#f00';x.fillRect(food.x*s,food.y*s,s-1,s-1)}
function update(){const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=20||h.y<0||h.y>=20||snake.some(p=>p.x===h.x&&p.y===h.y)){alert('Game Over! Score: '+score);location.reload();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent='Score: '+score;food={x:rand(),y:rand()}}else snake.pop();draw()}
setInterval(update,150);
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y===0)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x===0)dir={x:1,y:0}});
draw();
</script></body></html>
