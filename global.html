<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Global Chat — Onyx Cloud</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #eee; height: 100vh; display: flex; flex-direction: column; font-size: 13px; }
  header { padding: 12px 16px; border-bottom: 1px solid #1f1f1f; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; background: linear-gradient(90deg, #0f0, #0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header .count { margin-left: auto; font-size: 11px; color: #666; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
  .msg .user { font-size: 10px; color: #0f0; margin-bottom: 2px; font-weight: 600; }
  .msg .time { font-size: 9px; color: #555; margin-top: 2px; }
  .msg.user { align-self: flex-end; background: #1a4a1a; border: 1px solid #1f5f1f; }
  .msg.other { align-self: flex-start; background: #141414; border: 1px solid #1f1f1f; }
  .msg.system { align-self: center; background: #1a1a1a; color: #888; font-size: 11px; font-style: italic; }
  .msg.adult { border-color: #f0f; }
  #input-area { padding: 12px; border-top: 1px solid #1f1f1f; display: flex; gap: 8px; }
  #input { flex: 1; background: #141414; border: 1px solid #222; color: #eee; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 13px; }
  #input:focus { border-color: #0f0; }
  #send { background: #0f0; color: #000; border: none; width: 40px; height: 40px; border-radius: 50%; font-weight: 700; cursor: pointer; font-size: 16px; }
  .notice { padding: 8px 12px; background: #1a1a1a; border-left: 3px solid #0f0; font-size: 11px; color: #aaa; }
</style>
</head>
<body>
  <header>
    <h1>💬 Global Chat</h1>
    <div class="count" id="count">0 online</div>
  </header>
  <div class="notice">
    ⚠️ Be respectful. No illegal content. 18+ allowed. Violation = permanent ban.
  </div>
  <div id="chat"></div>
  <div id="input-area">
    <input id="input" placeholder="Type a message..." autocomplete="off">
    <button id="send" onclick="kirim()">↑</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const count = document.getElementById('count');
    let ws = null;
    const userId = localStorage.getItem('onyx_userId') || 'anon-' + Date.now();
    const username = localStorage.getItem('onyx_email') || 'Anonymous';

    function connectWS() {
      const serverUrl = localStorage.getItem('onyx_server_url') || window.location.origin;
      const wsUrl = serverUrl.replace('https://', 'wss://').replace('http://', 'ws://') + ':8083';
      
      ws = new WebSocket(wsUrl + '?userId=' + userId + '&username=' + encodeURIComponent(username));
      
      ws.onopen = () => addSystem('Connected to Global Chat');
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'message') addMessage(data);
        if (data.type === 'join') { addSystem(data.username + ' joined'); count.textContent = data.count + ' online'; }
        if (data.type === 'leave') { addSystem(data.username + ' left'); count.textContent = data.count + ' online'; }
        if (data.type === 'error') addSystem('⚠️ ' + data.error);
      };
      
      ws.onclose = () => { addSystem('Disconnected. Reconnecting...'); setTimeout(connectWS, 5000); };
      ws.onerror = () => {};
    }

    function addMessage(data) {
      const div = document.createElement('div');
      const isMe = data.userId === userId;
      div.className = 'msg ' + (isMe ? 'user' : 'other') + (data.category === 'adult' ? ' adult' : '');
      const time = new Date(data.ts).toLocaleTimeString();
      div.innerHTML = `<div class="user">${data.username}${data.category === 'adult' ? ' 🔞' : ''}</div><div>${data.text}</div><div class="time">${time}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addSystem(text) {
      const div = document.createElement('div');
      div.className = 'msg system';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function kirim() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'message', text }));
      input.value = '';
    }

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') kirim(); });
    connectWS();
  </script>
</body>
</html>
